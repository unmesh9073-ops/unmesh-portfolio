    <circle cx="885" cy="315" r="154" stroke="rgba(184,199,217,0.18)" stroke-width="1" stroke-dasharray="3 7" />
    <circle cx="885" cy="315" r="102" stroke="rgba(255,255,255,0.09)" stroke-width="1" />
    <ellipse cx="885" cy="315" rx="206" ry="74" transform="rotate(-24 885 315)" stroke="rgba(184,199,217,0.14)" stroke-width="1" />
    <ellipse cx="885" cy="315" rx="206" ry="74" transform="rotate(32 885 315)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

