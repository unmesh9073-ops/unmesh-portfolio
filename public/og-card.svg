      <line x1="885" y1="213" x2="994" y2="238" />
      <line x1="772" y1="226" x2="812" y2="334" />
      <line x1="812" y1="334" x2="885" y2="315" />
      <line x1="885" y1="213" x2="885" y2="315" />
      <line x1="994" y1="238" x2="958" y2="344" />
      <line x1="885" y1="315" x2="958" y2="344" />
      <line x1="812" y1="334" x2="848" y2="416" />
      <line x1="885" y1="315" x2="848" y2="416" />
      <line x1="958" y1="344" x2="988" y2="404" />
      <line x1="848" y1="416" x2="988" y2="404" />
      <line x1="734" y1="322" x2="812" y2="334" />
      <line x1="994" y1="238" x2="1044" y2="310" />
      <line x1="958" y1="344" x2="1044" y2="310" />
    </g>

    <!-- Neural Nodes -->
    <circle cx="885" cy="315" r="7" fill="#B8C7D9" />
    <circle cx="885" cy="315" r="14" stroke="#B8C7D9" stroke-opacity="0.32" stroke-width="1" />
    <circle cx="772" cy="226" r="4.5" fill="#F5F5F7" fill-opacity="0.85" />
    <circle cx="885" cy="213" r="4" fill="#B8C7D9" fill-opacity="0.9" />
    <circle cx="994" cy="238" r="5" fill="#F5F5F7" fill-opacity="0.9" />
    <circle cx="812" cy="334" r="4.5" fill="#B8C7D9" fill-opacity="0.85" />
    <circle cx="958" cy="344" r="4.5" fill="#F5F5F7" fill-opacity="0.9" />
    <circle cx="848" cy="416" r="4" fill="#F5F5F7" fill-opacity="0.75" />
    <circle cx="988" cy="404" r="4.5" fill="#B8C7D9" fill-opacity="0.8" />
