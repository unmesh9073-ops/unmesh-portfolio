<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <radialGradient id="obsidianGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(885 315) rotate(90) scale(340 340)">
      <stop offset="0%" stop-color="#1A222D" stop-opacity="0.72" />
      <stop offset="55%" stop-color="#111114" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#060608" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="subtleTopGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 90) rotate(90) scale(360 520)">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.045" />
      <stop offset="100%" stop-color="#060608" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="hairlineFade" x1="88" y1="520" x2="1112" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14" />
      <stop offset="65%" stop-color="#B8C7D9" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#060608" />
